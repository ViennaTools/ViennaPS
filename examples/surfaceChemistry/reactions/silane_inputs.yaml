name: silane_polySi_LPCVD_inputs
temperature: 900.0        # K

# The mechanism of `silane.yaml` restated through both alternative input forms.
# The incident flux is declared as a partial pressure rather than a flux, and
# the adsorption as a rate constant in cm/s rather than a sticking coefficient.
# Kinetic theory converts each, so the chemistry, and the answer, are unchanged.
species:
  SiH4:  {phase: gas,     pressure: 4.8403}     # mTorr, instead of flux: 1.0e3
  H2:    {phase: gas,     reemit_only: true}
  SiH3*: {phase: surface}
  H*:    {phase: surface}
  Si:    {phase: solid,   rho: 5.02}            # 1e22 atoms/cm^3

surface:
  - {eq: "SiH4 -> SiH3* + H*",    type: adsorption, k_ads: 1.9257e4, Ea: 0.6}
  - {eq: "SiH3* -> Si + H* + H2", type: surface,    k0: 6.8e12,      Ea: 1.5}
  - {eq: "2H* -> H2",             type: desorption, k0: 6.8e12,      Ea: 2.0}
