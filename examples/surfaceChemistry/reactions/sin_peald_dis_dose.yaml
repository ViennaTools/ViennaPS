name: sin_peald_dis_dose
temperature: 573.15       # K  (300 C, the paper's standard condition)
energyUnit: eV

# PE-ALD of SiNx from diiodosilane (DIS, SiH2I2) and an N2-H2 remote ICP
# plasma. STEP 1 OF 2: the DIS dose and the purge that follows it. The plasma
# step is sin_peald_n2h2_plasma.yaml. Both files declare the identical surface
# block below; the coverages leaving one step are the initial condition of
# the next.
#
# Process reference:
#   M. Zeghouane et al., Mater. Sci. Semicond. Process. 184 (2024) 108851.
#   Oxford FlexAL, remote ICP 300 W, 300 C, N2:H2 = 20:10 sccm (H2/N2 = 0.5).
#   Cycle: DIS 200 ms | Ar purge 3 s | N2-H2 plasma 15 s | Ar purge 3 s.
#   GPC 0.36-0.40 A/cycle, rho = 3.17 g/cm3, N/Si = 1.27, iodine below the
#   XPS detection limit.
#
# Chemistry: the halide route. The precursor bonds to a surface amine under
# HI elimination.
#
#   Ovanesyan et al., ACS Appl. Mater. Interfaces 7 (2015) 10806, and the
#   review JVST A 37 (2019) 060904: for Si2Cl6 + NH3 plasma the precursor
#   reacts with surface -NH2 to give -NH, and plasma radicals abstract the
#   halogen and restore the NHx termination. A1 and A2 transcribe this with I
#   in place of Cl.
#
#   Ande et al., J. Phys. Chem. Lett. 6 (2015) 3610: on H- or NH2-terminated
#   beta-Si3N4(0001), steric hindrance weakens precursor adsorption, while
#   under-coordinated sites adsorb strongly. A0 is the under-coordinated
#   channel.
#
# Saturation: A1 consumes one amine and A2 a second, while the plasma step
# returns one nitrogen per deposited silicon. The dose therefore saturates
# when the amines are consumed, at about half the amine coverage. A1 balances
# with zero free sites; see the surface block.
#
# The film forms in the plasma step, where nitridation joins the adsorbed
# silyl to the Si-N network. This step has growthRate = 0 and leaves the film
# boundary in place.
#
# Purge: this same mechanism with Gamma(SiH2I2) = 0. The thermal step A2
# continues through the purge.

species:
  # Gamma from p(DIS) ~ 1 mTorr at 300 K, M = 283.9 g/mol: P/sqrt(2 pi m k T).
  SiH2I2: {phase: gas, flux: 1.0e2}          # 1e15 /cm2 /s
  HI:     {phase: gas, reemit_only: true}

  # --- the surface, IDENTICAL in both step files -------------------------
  # Both step files declare this block verbatim: ViennaChem derives the
  # coverage list from it, and the coverages of one step are the initial
  # condition of the next. Edits go into both copies; the driver compares the
  # two coverage lists and refuses a mismatched pair.
  #
  # A site is one surface nitrogen, and the species name states its
  # termination: two hydrogens, one hydrogen, or a silyl bonded to the
  # nitrogen. Because each of these species carries its nitrogen, reactions
  # among them conserve sites one to one, and A1 balances with zero free
  # sites: the amine itself is the reactive site.
  #
  # S0 = 4e14 /cm2: the density of reactive amine sites on amorphous SiNx,
  # below the formula-unit density n^(2/3) = 5.7e14 /cm2 because a fraction
  # of the surface nitrogens carries a reactive NHx. S0 scales the coverage
  # ODE; the surface velocity follows from the radical fluxes and rho.
  NH2*:     {phase: surface, S0: 4.0e14}   # amine: the site DIS reacts with
  NH*:      {phase: surface}               # imide: after one HI elimination
  NHSiH2I*: {phase: surface}               # a nitrogen carrying an iodosilyl
  NHSiH2*:  {phase: surface}               # the same, iodine stripped

  # SiH2I2* and I* occupy bare sites: adsorption into them consumes a free
  # site, and the free-site terms follow from the equations by site inference.
  SiH2I2*:  {phase: surface}               # DIS molecularly adsorbed on a bare site
  I*:       {phase: surface}               # iodine blocking a site

  # rho is the Si-atom density of the film, since the solid unit written
  # below carries one Si: 3.17 g/cm3 with N/Si = 1.27 gives 4.16e22 Si/cm3.
  SiN:      {phase: solid, rho: 4.16}      # 1e22 /cm3

siteTypes:
  - {name: default, density: 4.0e14}         # /cm2

surface:
  # [A0] molecular adsorption on a bare, under-coordinated site: Ande's
  #      strong channel, and the growth channel that remains under pure N2.
  #      Both iodines stay on the fragment for the plasma step to remove.
  #      Written first so that A1 remains the LAST adsorption step consuming
  #      SiH2I2: the compiler assigns a traced species the sticking of its
  #      last adsorption step, and A1 dominates on the NHx-terminated surface
  #      the plasma leaves.
  - {eq: "SiH2I2 -> SiH2I2*", type: adsorption, s0: 0.10, Ea: 0.0}

  # [A1] HI elimination on an amine site: the precursor's first bond to the
  #      surface. s0 follows from the paper's dose-saturation curve: the GPC
  #      is within 20% of saturation by 50 ms at Gamma = 1e17 /cm2/s, giving
  #      s0 ~ S0/(Gamma t) ~ 4e14/(1e17 * 0.05) ~ 0.08.
  #
  #      Ea = 0 follows from the measured temperature window. On an
  #      adsorption step the barrier multiplies the sticking,
  #      s = s0 exp(-Ea/kT), so Ea = 0.15 eV would scale s by 21 at 300 C and
  #      swing the GPC eightfold between 110 and 300 C; the paper measures
  #      the GPC flat to 0.04 A over that range. HI elimination of a
  #      halosilane on an amine is facile.
  - {eq: "SiH2I2 + NH2* -> NHSiH2I* + HI", type: adsorption, s0: 0.08, Ea: 0.0}

  # [A2] the second HI elimination: the silyl bridges to a neighbouring amine
  #      and loses its remaining iodine. Thermally activated, hence the mild
  #      temperature dependence of the GPC over 110-300 C; it continues
  #      through the purge.
  - {eq: "NHSiH2I* + NH2* -> NHSiH2* + NH* + HI", type: surface,
     k0: 1.0e13, Ea: 1.05}
