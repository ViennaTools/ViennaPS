name: silane_selective_epitaxy
temperature: 900.0        # K

# Area-selective deposition: the same silane chemistry, but the film nucleates
# on silicon and is suppressed on the oxide and the mask.
#
# This is how selective epitaxy and area-selective deposition are run in
# practice: a surface is prepared (native oxide, or a self-assembled monolayer)
# on which the precursor does not dissociate, so growth happens only where the
# substrate is exposed.
#
# The selectivity lives on the ADSORPTION step, which is the physical picture:
# SiH4 dissociates on a clean Si dangling bond and does not on SiO2. Everything
# downstream (the coverage balance, the growth rate) follows automatically,
# because with no adsorption there is no SiH3* to incorporate.
#
#   materials:
#     default: 0.0     every material not named is inert
#     Si:      1.0     full rate on silicon
#     PolySi:  1.0     and on the growing film, so growth continues
#     SiO2:    0.01    a small residual, the usual imperfect selectivity
#
# A reaction with no `materials:` block behaves exactly as before.
species:
  SiH4:  {phase: gas,     flux: 1.0e3}          # Gamma in 1e15 /cm^2 /s
  H2:    {phase: gas,     reemit_only: true}
  SiH3*: {phase: surface}
  H*:    {phase: surface}
  Si:    {phase: solid,   rho: 5.02}            # 1e22 atoms/cm^3

surface:
  - {eq: "SiH4 -> SiH3* + H*",    type: adsorption, s0: 1.0,    Ea: 0.6,
     materials: {default: 0.0, Si: 1.0, PolySi: 1.0, SiO2: 0.01}}
  - {eq: "SiH3* -> Si + H* + H2", type: surface,    k0: 6.8e12, Ea: 1.5}
  - {eq: "2H* -> H2",             type: desorption, k0: 6.8e12, Ea: 2.0}
