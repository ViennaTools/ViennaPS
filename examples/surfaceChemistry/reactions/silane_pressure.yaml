name: silane_polySi_LPCVD_pressure
temperature: 900.0        # K

# The same mechanism as silane.yaml, with the SiH4 supply given as a partial
# pressure (mTorr unless the file sets `pressureUnit`) instead of a flux.
# Kinetic theory converts it: the wall flux of an ideal gas is (1/4) n vbar
# with n = p / (kB T), i.e.
#
#     Gamma = p / sqrt(2 pi m kB T),
#
# with the molar mass m taken from the formula, so the pressure is the only
# number asked for. 4.8403 mTorr reproduces Gamma = 1.0e3 (1e15 /cm^2 /s) at
# 900 K, so this file matches silane.yaml there. The pressure and the
# temperature are the quantities a reactor set point actually controls.
species:
  SiH4:  {phase: gas,     pressure: 4.8403}
  H2:    {phase: gas,     reemit_only: true}
  SiH3*: {phase: surface}
  H*:    {phase: surface}
  Si:    {phase: solid,   rho: 5.02}            # 1e22 atoms/cm^3

surface:
  - {eq: "SiH4 -> SiH3* + H*",    type: adsorption, s0: 1.0,    Ea: 0.6}
  - {eq: "SiH3* -> Si + H* + H2", type: surface,    k0: 6.8e12, Ea: 1.5}
  - {eq: "2H* -> H2",             type: desorption, k0: 6.8e12, Ea: 2.0}
